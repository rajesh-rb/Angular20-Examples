<div class="search-container">
  <input
    type="text"
    [formControl]="searchControl"
    placeholder="Search users..."
    class="search-input"
  />

  <div class="grid">
    <div class="card" *ngFor="let user of users$ | async">
      <h3>{{ user.name }}</h3>
      <p>Email: {{ user.email }}</p>
      <p>Company: {{ user.company.name }}</p>
    </div>
  </div>
</div>
