<div class="min-vh-100 d-flex flex-column">
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-dark">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" [routerLink]="''">
        <span class="bg-warning text-dark rounded px-2 py-1 fw-bold">US</span>
        <span>UserShop</span>
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#topNav"
        aria-controls="topNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="topNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-lg-1">
          <li class="nav-item">
            <a
              class="nav-link"
              [routerLink]="''"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" [routerLink]="'/products'" routerLinkActive="active"> Products </a>
          </li>

          @if (auth.isLoggedIn) {
            <li class="nav-item">
              <a class="nav-link" [routerLink]="'/profile'" routerLinkActive="active"> Profile </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" [routerLink]="'/orders'" routerLinkActive="active"> Orders </a>
            </li>
          }
        </ul>

        <div class="d-flex align-items-center gap-2">
          @if (auth.isLoggedIn && auth.currentUser) {
            <div class="d-none d-lg-flex align-items-center text-white-50 me-2">
              <span class="me-2">Hi,</span>
              <span class="text-white fw-semibold">{{ auth.currentUser!.fullName }}</span>
            </div>

            <button class="btn btn-warning btn-sm px-3" (click)="logoutNow()">Logout</button>
          } @else {
            <a class="btn btn-outline-light btn-sm px-3" [routerLink]="'/login'">Login</a>
          }
        </div>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="flex-grow-1 bg-light">
    <router-outlet></router-outlet>
  </main>

  <!-- FOOTER -->
  <footer class="bg-white border-top mt-auto">
    <div
      class="container py-3 d-flex flex-column flex-md-row justify-content-between align-items-center gap-2"
    >
      <div class="text-muted small">© {{ year }} UserShop. All rights reserved.</div>
      <div class="text-muted small d-flex gap-3">
        <span>Privacy</span>
        <span>Terms</span>
        <span>Support</span>
      </div>
    </div>
  </footer>
</div>
